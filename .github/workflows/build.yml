name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\sark-loting.iss
          Copy-Item target\release\sark-loting.exe SARK-Loting-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SARK-Loting-windows
          path: |
            installer\Output\SARK-Loting-Setup.exe
            SARK-Loting-portable.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/SARK-Loting-Setup.exe
            SARK-Loting-portable.exe
